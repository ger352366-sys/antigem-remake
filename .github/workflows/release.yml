name: Build & Publish Release

on:
  push:
    branches:
      - main
      - standalone
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone TermuxAm
        run: |
          rm -rf termux-am
          git clone --depth 1 https://github.com/termux/TermuxAm.git termux-am

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'agy_ide_bridge/go.mod'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 scripts/release_version.py name "${GITHUB_WORKSPACE}/version.json")
          CHANNEL=$(python3 scripts/release_version.py channel "${GITHUB_WORKSPACE}/version.json")
          CHANGELOG=$(python3 scripts/release_version.py changelog "${GITHUB_WORKSPACE}/version.json")
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Self-signed Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          else
            echo "Generating self-signed release.jks"
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias antigem \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=AntiGem, OU=Dev, O=AntiGem, L=Hanoi, S=Hanoi, C=VN"
          fi

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.changelog }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
